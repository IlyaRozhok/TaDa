name: Install DB backup

# One-time (and safely repeatable) installer for the production database backup.
#
# ZERO SUDO. The production SSH user does not have passwordless sudo — the first
# attempt at this installer died on `sudo: a password is required` (2026-08-12),
# cleanly and before any writes. Everything below therefore happens with the
# ordinary privileges of that user: files under $HOME, the AWS CLI installed
# into $HOME, and scheduling via that user's crontab instead of a system systemd
# timer.
#
# What it does on the production host, in order:
#   1. Prints the facts — psql/pg_dump version, server version, DB_* from
#      /opt/tada/.env (password masked), whether the role can create databases,
#      and df -h.
#   2. Installs AWS CLI v2 into $HOME/.local if `aws` is not already available.
#   3. Probes which host:port actually authenticates (172.18.0.1, 127.0.0.1,
#      localhost) and records the winner.
#   4. Installs the scripts into $HOME/.local/bin.
#   5. Writes $HOME/.config/tada/backup.env (chmod 600) from the BACKUP_AWS_*
#      GitHub secrets, including the probed BACKUP_DB_HOST.
#   6. Installs an every-6-hours entry in the user crontab, idempotently.
#   7. Runs ONE backup and confirms with `aws s3 ls` that the object landed.
#
# Everything is idempotent: re-running re-installs the same files and rewrites
# the same crontab block. It never drops, deletes or restores anything.
#
# Required GitHub secrets:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT   (already used by deploy.yml)
#   BACKUP_AWS_ACCESS_KEY_ID                     (tada-backup-uploader)
#   BACKUP_AWS_SECRET_ACCESS_KEY                 (tada-backup-uploader)
#
# See docs/ops/BACKUP_RUNBOOK.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "install" to confirm — this changes the production host'
        required: true
        default: ''
      ref:
        description: 'Git ref on the host to install the scripts from'
        required: true
        default: 'main'
      bucket:
        description: 'S3 bucket for backups'
        required: true
        default: 'tada-db-backups'
      region:
        description: 'AWS region of the bucket'
        required: true
        default: 'eu-west-2'
      run_backup_now:
        description: 'Run one backup at the end to verify end to end'
        type: boolean
        default: true

jobs:
  install:
    name: Install backup on production host
    runs-on: ubuntu-latest

    steps:
      - name: Check confirmation
        if: ${{ inputs.confirm != 'install' }}
        run: |
          echo "::error::Type 'install' in the confirm field to run this workflow."
          exit 1

      - name: Install and verify over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKUP_AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          BACKUP_AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          INSTALL_REF: ${{ inputs.ref }}
          BACKUP_BUCKET: ${{ inputs.bucket }}
          BACKUP_REGION: ${{ inputs.region }}
          RUN_BACKUP_NOW: ${{ inputs.run_backup_now }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: BACKUP_AWS_ACCESS_KEY_ID,BACKUP_AWS_SECRET_ACCESS_KEY,INSTALL_REF,BACKUP_BUCKET,BACKUP_REGION,RUN_BACKUP_NOW
          script: |
            set -euo pipefail

            APP_DIR=/opt/tada/app
            ENV_FILE=/opt/tada/.env
            BIN_DIR="$HOME/.local/bin"
            CONF_DIR="$HOME/.config/tada"
            BACKUP_ENV="$CONF_DIR/backup.env"
            STAGING_DIR="$HOME/.local/var/backups/tada"
            LOG_DIR="$HOME/.local/var/log"
            LOG_FILE="$LOG_DIR/tada-backup.log"
            CRON_LOG="$LOG_DIR/tada-backup-cron.log"

            export PATH="$BIN_DIR:$PATH"

            echo "==================================================================="
            echo "STEP 1 — facts about this host"
            echo "==================================================================="
            echo "whoami:          $(whoami)"
            echo "home:            $HOME"
            echo "pg_dump:         $(pg_dump --version 2>/dev/null || echo 'NOT INSTALLED')"
            echo "psql:            $(psql --version 2>/dev/null || echo 'NOT INSTALLED')"

            if [ ! -r "$ENV_FILE" ]; then
              echo "::error::${ENV_FILE} is not readable by $(whoami)"
              exit 1
            fi

            read_env() {
              line="$(grep -E "^[[:space:]]*(export[[:space:]]+)?$1=" "$ENV_FILE" | tail -n 1 || true)"
              value="${line#*=}"
              value="${value%$'\r'}"
              case "$value" in
                \"*\") value="${value#\"}"; value="${value%\"}" ;;
                \'*\') value="${value#\'}"; value="${value%\'}" ;;
              esac
              printf '%s' "$value"
            }

            DB_NAME="$(read_env DB_NAME)"
            DB_USER="$(read_env DB_USER)"
            DB_PORT="$(read_env DB_PORT)"
            DB_PASSWORD="$(read_env DB_PASSWORD)"
            DB_PORT="${DB_PORT:-5432}"

            echo "--- /opt/tada/.env (password masked) ---"
            echo "DB_NAME=${DB_NAME}"
            echo "DB_USER=${DB_USER}"
            echo "DB_PORT=${DB_PORT}"
            echo "DB_HOST=$(read_env DB_HOST)   <- container-only name, not used by the backup"
            if [ -n "$DB_PASSWORD" ]; then echo "DB_PASSWORD=******** (set)"; else echo "DB_PASSWORD is NOT set"; fi

            if [ -z "$DB_NAME" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ]; then
              echo "::error::DB_NAME, DB_USER and DB_PASSWORD must all be set in ${ENV_FILE}"
              exit 1
            fi

            echo "--- disk ---"
            df -h "$HOME" / 2>/dev/null || df -h

            echo
            echo "==================================================================="
            echo "STEP 2 — AWS CLI (userspace, no root)"
            echo "==================================================================="
            if command -v aws >/dev/null 2>&1; then
              echo "aws already available: $(command -v aws) — $(aws --version 2>&1)"
            else
              echo "installing AWS CLI v2 into \$HOME/.local (no root required)"
              mkdir -p "$BIN_DIR" "$HOME/.local/aws-cli"
              TMP_AWS="$(mktemp -d)"
              case "$(uname -m)" in
                aarch64|arm64) AWS_ZIP_URL="https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" ;;
                *)             AWS_ZIP_URL="https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" ;;
              esac
              echo "downloading ${AWS_ZIP_URL}"
              curl -fsSL "$AWS_ZIP_URL" -o "$TMP_AWS/awscliv2.zip"

              # `unzip` is not guaranteed to be installed and we cannot apt-get
              # it without root; python3 is always present on this host.
              if command -v unzip >/dev/null 2>&1; then
                unzip -q "$TMP_AWS/awscliv2.zip" -d "$TMP_AWS"
              else
                echo "unzip missing — extracting with python3"
                python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" \
                  "$TMP_AWS/awscliv2.zip" "$TMP_AWS"
                chmod +x "$TMP_AWS/aws/install" "$TMP_AWS/aws/dist/aws" 2>/dev/null || true
              fi

              "$TMP_AWS/aws/install" -i "$HOME/.local/aws-cli" -b "$BIN_DIR" --update
              rm -rf "$TMP_AWS"
              echo "installed: $(command -v aws) — $(aws --version 2>&1)"
            fi

            command -v aws >/dev/null 2>&1 || { echo "::error::aws CLI still not on PATH"; exit 1; }
            command -v pg_dump >/dev/null 2>&1 || { echo "::error::pg_dump not found"; exit 1; }

            echo
            echo "==================================================================="
            echo "STEP 3 — probe the database host"
            echo "==================================================================="
            # /opt/tada/.env says DB_HOST=host.docker.internal, which resolves
            # only inside a container. Postgres listens on localhost,172.18.0.1
            # and pg_hba grants this role over 172.18.0.0/16, so probe for real.
            export PGPASSWORD="$DB_PASSWORD"
            DB_HOST_USED=""
            for candidate in 172.18.0.1 127.0.0.1 localhost; do
              printf 'probing %s:%s ... ' "$candidate" "$DB_PORT"
              if psql -h "$candidate" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
                      -v ON_ERROR_STOP=1 -tAc 'SELECT 1' >/dev/null 2>&1; then
                echo "OK"
                DB_HOST_USED="$candidate"
                break
              fi
              echo "no"
            done

            if [ -z "$DB_HOST_USED" ]; then
              echo "::error::No candidate host authenticated for ${DB_USER}@${DB_NAME}. Check listen_addresses and pg_hba.conf."
              exit 1
            fi
            echo "using DB host: ${DB_HOST_USED}"

            SERVER_VERSION="$(psql -h "$DB_HOST_USED" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -tAc 'SHOW server_version')"
            echo "server_version:  ${SERVER_VERSION}"

            # pg_dump must be at least as new as the server, or the dump fails.
            DUMP_MAJOR="$(pg_dump --version | sed -E 's/.* ([0-9]+).*/\1/')"
            SERVER_MAJOR="$(printf '%s' "$SERVER_VERSION" | sed -E 's/^([0-9]+).*/\1/')"
            echo "pg_dump major=${DUMP_MAJOR}, server major=${SERVER_MAJOR}"
            if [ "$DUMP_MAJOR" -lt "$SERVER_MAJOR" ]; then
              echo "::error::pg_dump ${DUMP_MAJOR} is older than the server (${SERVER_MAJOR})."
              exit 1
            fi

            # Read-only preflight for the RESTORE path: creating a scratch
            # database needs CREATEDB. Reported now so the rehearsal
            # (LAUNCH_PLAN #1/#2) does not discover it later.
            CAN_CREATEDB="$(psql -h "$DB_HOST_USED" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
              -tAc 'SELECT rolcreatedb FROM pg_roles WHERE rolname = current_user' || echo '?')"
            echo "role ${DB_USER} has CREATEDB: ${CAN_CREATEDB}  (needed only for restore-to-scratch)"
            if [ "$CAN_CREATEDB" != "t" ]; then
              echo "note: the rehearsal restore will need 'ALTER ROLE ${DB_USER} CREATEDB;' plus a pg_hba line — see BACKUP_RUNBOOK.md §5"
            fi

            echo
            echo "==================================================================="
            echo "STEP 4 — install scripts from ref '${INSTALL_REF}' into \$HOME/.local/bin"
            echo "==================================================================="
            mkdir -p "$BIN_DIR" "$CONF_DIR" "$STAGING_DIR" "$LOG_DIR"
            chmod 0700 "$CONF_DIR" "$STAGING_DIR"
            touch "$LOG_FILE" "$CRON_LOG"
            chmod 0600 "$LOG_FILE" "$CRON_LOG"

            # `git show` reads straight out of the object database, so the
            # deployed working tree at ${APP_DIR} is not touched at all.
            git -C "$APP_DIR" fetch --quiet origin "$INSTALL_REF"

            install_from_git() {
              src="$1"; dest="$2"
              git -C "$APP_DIR" show "origin/${INSTALL_REF}:${src}" > "$dest.tmp"
              mv "$dest.tmp" "$dest"
              chmod 0755 "$dest"
              echo "installed ${dest}"
            }

            install_from_git scripts/db-backup.sh  "$BIN_DIR/tada-db-backup"
            install_from_git scripts/db-restore.sh "$BIN_DIR/tada-db-restore"
            ls -l "$BIN_DIR"

            echo
            echo "==================================================================="
            echo "STEP 5 — credentials file"
            echo "==================================================================="
            if [ -z "${BACKUP_AWS_ACCESS_KEY_ID:-}" ] || [ -z "${BACKUP_AWS_SECRET_ACCESS_KEY:-}" ]; then
              echo "::error::BACKUP_AWS_ACCESS_KEY_ID / BACKUP_AWS_SECRET_ACCESS_KEY secrets are not set in GitHub."
              exit 1
            fi

            # umask first so the file is never briefly group/world readable.
            # Values go through a heredoc and are never echoed.
            umask 077
            cat > "$BACKUP_ENV" <<EOF
            # Credentials for the write-only tada-backup-uploader IAM user, plus
            # the database host probed at install time.
            # Managed by .github/workflows/backup-setup.yml — do not edit by hand.
            AWS_ACCESS_KEY_ID=${BACKUP_AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY=${BACKUP_AWS_SECRET_ACCESS_KEY}
            AWS_DEFAULT_REGION=${BACKUP_REGION}
            BACKUP_BUCKET=${BACKUP_BUCKET}
            BACKUP_DB_HOST=${DB_HOST_USED}
            EOF
            chmod 0600 "$BACKUP_ENV"
            umask 022
            echo "wrote ${BACKUP_ENV}:"
            ls -l "$BACKUP_ENV"
            echo "keys present: $(grep -cE '^[A-Z_]+=' "$BACKUP_ENV") (expect 5)"

            echo
            echo "==================================================================="
            echo "STEP 6 — schedule via the user crontab"
            echo "==================================================================="
            # A system systemd timer would need root. cron for this user does
            # not. The trade-off: cron has no equivalent of systemd's
            # Persistent=true, so a run missed while the host was down is simply
            # skipped rather than caught up. The pre-deploy backup in deploy.yml
            # covers the case that matters most; the rest is a 6-hour window.
            CRON_TMP="$(mktemp)"
            crontab -l 2>/dev/null | sed '/# BEGIN tada-db-backup/,/# END tada-db-backup/d' > "$CRON_TMP" || true
            cat >> "$CRON_TMP" <<EOF
            # BEGIN tada-db-backup (managed by .github/workflows/backup-setup.yml — do not edit)
            PATH=${BIN_DIR}:/usr/local/bin:/usr/bin:/bin
            0 */6 * * * ${BIN_DIR}/tada-db-backup >> ${CRON_LOG} 2>&1
            # END tada-db-backup
            EOF
            crontab "$CRON_TMP"
            rm -f "$CRON_TMP"
            echo "--- crontab -l ---"
            crontab -l

            echo
            echo "==================================================================="
            echo "STEP 7 — end-to-end verification"
            echo "==================================================================="
            if [ "${RUN_BACKUP_NOW}" != "true" ]; then
              echo "skipped (run_backup_now was false)"
              exit 0
            fi

            "$BIN_DIR/tada-db-backup"

            echo "--- objects under today's daily/ prefix ---"
            # Subshell so the credentials never leak into the rest of the session.
            (
              set -a
              # shellcheck disable=SC1090
              . "$BACKUP_ENV"
              set +a
              aws s3 ls "s3://${BACKUP_BUCKET}/daily/$(date +%Y/%m/%d)/"
            )

            echo "--- local staging dir ---"
            ls -lh "$STAGING_DIR"

            echo
            echo "Backup is installed and verified end to end. No root was used."
            echo "Next: read docs/ops/BACKUP_RUNBOOK.md and rehearse a restore (LAUNCH_PLAN #1/#2)."
