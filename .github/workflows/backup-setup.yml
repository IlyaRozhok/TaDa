name: Install DB backup

# One-time (and safely repeatable) installer for the production database backup.
#
# What it does on the production host, in order:
#   1. Prints the facts we inferred — psql/pg_dump version, server version,
#      DB_NAME from /opt/tada/.env (password masked), disk free.
#   2. Installs awscli and a matching postgresql-client, only if missing.
#   3. Installs scripts/db-backup.sh and scripts/db-restore.sh into
#      /usr/local/bin, and the systemd unit + timer into /etc/systemd/system.
#   4. Creates /var/backups/tada and /var/log/tada-backup.log owned by deploy.
#   5. Writes /opt/tada/backup.env (chmod 600, owned by deploy) from the
#      BACKUP_AWS_* GitHub secrets.
#   6. Enables the 6-hourly timer.
#   7. Runs ONE backup and confirms with `aws s3 ls` that the object landed.
#
# Everything is idempotent: re-running re-installs the same files and re-enables
# the same timer. It never drops, deletes or restores anything.
#
# Required GitHub secrets:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT   (already used by deploy.yml)
#   BACKUP_AWS_ACCESS_KEY_ID                     (tada-backup-uploader)
#   BACKUP_AWS_SECRET_ACCESS_KEY                 (tada-backup-uploader)
#
# See docs/ops/BACKUP_RUNBOOK.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "install" to confirm — this changes the production host'
        required: true
        default: ''
      ref:
        description: 'Git ref on the host to install the scripts from'
        required: true
        default: 'main'
      bucket:
        description: 'S3 bucket for backups'
        required: true
        default: 'tada-db-backups'
      region:
        description: 'AWS region of the bucket'
        required: true
        default: 'eu-west-2'
      run_backup_now:
        description: 'Run one backup at the end to verify end to end'
        type: boolean
        default: true

jobs:
  install:
    name: Install backup on production host
    runs-on: ubuntu-latest

    steps:
      - name: Check confirmation
        if: ${{ inputs.confirm != 'install' }}
        run: |
          echo "::error::Type 'install' in the confirm field to run this workflow."
          exit 1

      - name: Install and verify over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKUP_AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          BACKUP_AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          INSTALL_REF: ${{ inputs.ref }}
          BACKUP_BUCKET: ${{ inputs.bucket }}
          BACKUP_REGION: ${{ inputs.region }}
          RUN_BACKUP_NOW: ${{ inputs.run_backup_now }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: BACKUP_AWS_ACCESS_KEY_ID,BACKUP_AWS_SECRET_ACCESS_KEY,INSTALL_REF,BACKUP_BUCKET,BACKUP_REGION,RUN_BACKUP_NOW
          script: |
            set -euo pipefail

            APP_DIR=/opt/tada/app
            ENV_FILE=/opt/tada/.env
            BACKUP_ENV=/opt/tada/backup.env
            STAGING_DIR=/var/backups/tada
            LOG_FILE=/var/log/tada-backup.log

            echo "==================================================================="
            echo "STEP 1 — facts about this host (confirming what we assumed)"
            echo "==================================================================="
            echo "whoami:          $(whoami)"
            echo "pg_dump:         $(pg_dump --version 2>/dev/null || echo 'NOT INSTALLED')"
            echo "psql:            $(psql --version 2>/dev/null || echo 'NOT INSTALLED')"

            SERVER_VERSION="$(sudo -u postgres psql -tAc 'SHOW server_version' 2>/dev/null || echo 'unreachable')"
            echo "server_version:  ${SERVER_VERSION}"

            echo "--- /opt/tada/.env (password masked) ---"
            if [ -r "$ENV_FILE" ]; then
              grep -E '^[[:space:]]*(export[[:space:]]+)?DB_(HOST|PORT|USER|NAME)=' "$ENV_FILE" || true
              if grep -qE '^[[:space:]]*(export[[:space:]]+)?DB_PASSWORD=' "$ENV_FILE"; then
                echo "DB_PASSWORD=******** (set)"
              else
                echo "DB_PASSWORD is NOT set"
              fi
            else
              echo "::error::${ENV_FILE} is not readable"
              exit 1
            fi

            echo "--- disk ---"
            df -h / /var 2>/dev/null || df -h

            echo
            echo "==================================================================="
            echo "STEP 2 — packages"
            echo "==================================================================="

            # Only touch apt if something is actually missing; an install run
            # should not upgrade half the host as a side effect.
            NEED_APT=0
            command -v aws >/dev/null 2>&1 || NEED_APT=1
            command -v pg_dump >/dev/null 2>&1 || NEED_APT=1

            if [ "$NEED_APT" -eq 1 ]; then
              echo "installing missing packages..."
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
              command -v aws >/dev/null 2>&1 || \
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq awscli
              command -v pg_dump >/dev/null 2>&1 || \
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client-16
            else
              echo "aws and pg_dump are already present — nothing to install"
            fi

            command -v aws >/dev/null 2>&1 || {
              echo "::error::aws CLI is still missing. Install AWS CLI v2 by hand (see BACKUP_RUNBOOK.md) and re-run."
              exit 1
            }
            command -v pg_dump >/dev/null 2>&1 || {
              echo "::error::pg_dump is still missing."
              exit 1
            }

            # pg_dump must be at least as new as the server, or the dump fails.
            DUMP_MAJOR="$(pg_dump --version | sed -E 's/.* ([0-9]+).*/\1/')"
            SERVER_MAJOR="$(printf '%s' "$SERVER_VERSION" | sed -E 's/^([0-9]+).*/\1/')"
            echo "pg_dump major=${DUMP_MAJOR}, server major=${SERVER_MAJOR}"
            if [ "$SERVER_MAJOR" -gt 0 ] 2>/dev/null && [ "$DUMP_MAJOR" -lt "$SERVER_MAJOR" ]; then
              echo "::error::pg_dump ${DUMP_MAJOR} is older than the server (${SERVER_MAJOR}). Install postgresql-client-${SERVER_MAJOR}."
              exit 1
            fi

            echo
            echo "==================================================================="
            echo "STEP 3 — install scripts and systemd units from ref '${INSTALL_REF}'"
            echo "==================================================================="

            # `git show` reads straight out of the object database, so the
            # deployed working tree at ${APP_DIR} is not touched at all.
            git -C "$APP_DIR" fetch --quiet origin "$INSTALL_REF"

            install_from_git() {
              src="$1"; dest="$2"; mode="$3"
              tmp="$(mktemp)"
              git -C "$APP_DIR" show "origin/${INSTALL_REF}:${src}" > "$tmp"
              sudo install -m "$mode" -o root -g root "$tmp" "$dest"
              rm -f "$tmp"
              echo "installed ${dest} (mode ${mode})"
            }

            install_from_git scripts/db-backup.sh  /usr/local/bin/tada-db-backup  0755
            install_from_git scripts/db-restore.sh /usr/local/bin/tada-db-restore 0755
            install_from_git deploy/systemd/tada-db-backup.service /etc/systemd/system/tada-db-backup.service 0644
            install_from_git deploy/systemd/tada-db-backup.timer   /etc/systemd/system/tada-db-backup.timer   0644

            echo
            echo "==================================================================="
            echo "STEP 4 — directories and log file"
            echo "==================================================================="
            sudo mkdir -p "$STAGING_DIR"
            sudo chown "$(whoami)":"$(id -gn)" "$STAGING_DIR"
            sudo chmod 0750 "$STAGING_DIR"
            sudo touch "$LOG_FILE"
            sudo chown "$(whoami)":"$(id -gn)" "$LOG_FILE"
            sudo chmod 0640 "$LOG_FILE"
            ls -ld "$STAGING_DIR" "$LOG_FILE"

            echo
            echo "==================================================================="
            echo "STEP 5 — credentials file"
            echo "==================================================================="
            if [ -z "${BACKUP_AWS_ACCESS_KEY_ID:-}" ] || [ -z "${BACKUP_AWS_SECRET_ACCESS_KEY:-}" ]; then
              echo "::error::BACKUP_AWS_ACCESS_KEY_ID / BACKUP_AWS_SECRET_ACCESS_KEY secrets are not set in GitHub."
              exit 1
            fi

            # umask first so the file is never briefly world-readable. Values are
            # written through a heredoc, never echoed.
            umask 077
            cat > /tmp/backup.env.$$ <<EOF
            # Credentials for the write-only tada-backup-uploader IAM user.
            # Managed by .github/workflows/backup-setup.yml — do not edit by hand.
            AWS_ACCESS_KEY_ID=${BACKUP_AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY=${BACKUP_AWS_SECRET_ACCESS_KEY}
            AWS_DEFAULT_REGION=${BACKUP_REGION}
            BACKUP_BUCKET=${BACKUP_BUCKET}
            EOF
            sudo install -m 0600 -o "$(whoami)" -g "$(id -gn)" /tmp/backup.env.$$ "$BACKUP_ENV"
            rm -f /tmp/backup.env.$$
            umask 022
            echo "wrote ${BACKUP_ENV}:"
            ls -l "$BACKUP_ENV"
            echo "keys present: $(grep -cE '^[A-Z_]+=' "$BACKUP_ENV") (expect 4)"

            echo
            echo "==================================================================="
            echo "STEP 6 — enable the timer"
            echo "==================================================================="
            sudo systemctl daemon-reload
            sudo systemctl enable --now tada-db-backup.timer
            systemctl status tada-db-backup.timer --no-pager || true
            systemctl list-timers tada-db-backup.timer --no-pager || true

            echo
            echo "==================================================================="
            echo "STEP 7 — end-to-end verification"
            echo "==================================================================="
            if [ "${RUN_BACKUP_NOW}" != "true" ]; then
              echo "skipped (run_backup_now was false)"
              exit 0
            fi

            /usr/local/bin/tada-db-backup

            echo "--- objects under today's daily/ prefix ---"
            # Subshell so the credentials never leak into the rest of the session.
            (
              set -a
              # shellcheck disable=SC1090
              . "$BACKUP_ENV"
              set +a
              aws s3 ls "s3://${BACKUP_BUCKET}/daily/$(date +%Y/%m/%d)/"
            )

            echo "--- local staging dir ---"
            ls -lh "$STAGING_DIR"

            echo
            echo "Backup is installed and verified end to end."
            echo "Next: read docs/ops/BACKUP_RUNBOOK.md and rehearse a restore (LAUNCH_PLAN #1/#2)."
