name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 20 — та же мажорная версия, что в backend/Dockerfile (node:20-alpine).
      # Раньше здесь был Node 18: сборка проверялась не на том рантайме, где исполняется.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npx tsc -p tsconfig.json --noEmit

      - name: Unit tests
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend — typecheck, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run type-check

      - name: Unit tests
        working-directory: frontend
        run: npm test

      # Линт намеренно не включён: на фронте он сейчас нерабочий —
      # `next lint` удалён из CLI в Next 16, а прямой `npx eslint` падает на
      # FlatCompat + next/core-web-vitals (ESLint 9.34). Чинится в шаге 4.3
      # плана рефакторинга, после чего сюда добавляется шаг `npm run lint`.

      - name: Build
        working-directory: frontend
        run: npm run build

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGE_VPS_HOST }}
          username: ${{ secrets.STAGE_VPS_USER }}
          key: ${{ secrets.STAGE_VPS_SSH_KEY }}
          port: ${{ secrets.STAGE_VPS_PORT }}
          script: |
            set -e
            cd /opt/tada/app

            git pull origin develop

            docker compose build backend
            docker compose up -d --no-deps backend

            echo "Waiting for backend to be healthy..."
            sleep 10
            docker compose exec -T backend npm run mig:run:prod

            echo "Staging deploy complete"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /opt/tada/app

            git pull origin main

            docker compose build backend
            docker compose up -d --no-deps backend

            echo "Waiting for backend to be healthy..."
            sleep 10
            docker compose exec -T backend npm run mig:run:prod

            echo "Deploy complete"
