name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 20 — та же мажорная версия, что в backend/Dockerfile (node:20-alpine).
      # Раньше здесь был Node 18: сборка проверялась не на том рантайме, где исполняется.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npx tsc -p tsconfig.json --noEmit

      # Errors gate the build; warnings are the visible backlog (see
      # backend/eslint.config.mjs). `no-unused-vars` is the machine check for
      # the CLAUDE.md "no orphaned imports" rule.
      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Unit tests
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend — typecheck, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run type-check

      - name: Unit tests
        working-directory: frontend
        run: npm test

      # 0 errors is the gate; the ~360 warnings are the backlog. This step was
      # missing long after step 4.3 repaired the flat config — the old comment
      # here claimed lint was still broken.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  # Boots the real stack (Postgres service, backend on :5001, `next start` on
  # :3000) and runs the smoke subset of the Playwright suite — the specs that
  # hold on a freshly seeded database. The rest of the suite (admin CRUD,
  # matching badge, onboarding, shortlist, operator routing) expects richer
  # data and still runs locally / against stage.
  #
  # Schema comes from TYPEORM_SYNCHRONIZE=true (entities), NOT `migration:run`:
  # the migration chain cannot be replayed from an empty database — see
  # PROGRESS.md «Noticed along the way» 2026-08-18. When that is repaired this
  # job should switch to running migrations, which also puts the chain itself
  # under test.
  e2e-smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tada_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # global-setup reads DB_* and JWT_SECRET from this file to seed users
      # and mint cookies with the same secret the backend verifies against.
      - name: Write backend .env for the e2e stack
        working-directory: backend
        run: |
          cat > .env <<'EOF'
          NODE_ENV=development
          PORT=5001
          DB_HOST=localhost
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_NAME=tada_e2e
          DB_SSL=false
          TYPEORM_SYNCHRONIZE=true
          JWT_SECRET=e2e-ci-secret-not-a-real-secret
          EOF

      - name: Build and start backend
        working-directory: backend
        run: |
          npm run build
          nohup node dist/main.js > backend-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/api/health > /dev/null; then
              echo "backend is up"; exit 0
            fi
            sleep 2
          done
          echo "::error::backend did not become healthy"; tail -50 backend-e2e.log; exit 1

      # One operator and one listing so the units page and the property detail
      # page have something to render. Idempotent, clearly marked as e2e data.
      - name: Seed a property
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d tada_e2e -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users (id, email, role, full_name)
          VALUES ('e2e00000-0000-4000-8000-0000000000fe', 'e2e-seed-operator@tada-e2e.local', 'operator', 'E2E Seed Operator')
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO properties (id, title, operator_id, price, bedrooms, bathrooms, address)
          VALUES ('e2e00000-0000-4000-8000-0000000000ff', 'E2E Seed Property', 'e2e00000-0000-4000-8000-0000000000fe', 1500, 2, 1, '1 Test Street, London')
          ON CONFLICT (id) DO NOTHING;
          SQL

      # NEXT_PUBLIC_API_URL must be localhost, same host as the auth cookie's
      # domain — a 127.0.0.1 API URL makes the browser drop the cookie and
      # every authenticated spec fails on a silently logged-out page.
      - name: Build and start frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001/api
        run: |
          npm run build
          nohup npx next start -p 3000 > frontend-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "frontend is up"; exit 0
            fi
            sleep 2
          done
          echo "::error::frontend did not come up"; tail -50 frontend-e2e.log; exit 1

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke specs
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://localhost:5001/api
        run: npx playwright test e2e/auth.spec.ts e2e/session-refresh.spec.ts e2e/role-escalation.spec.ts e2e/property-browsing.spec.ts e2e/robots.spec.ts

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/test-results/
            backend/backend-e2e.log
            frontend/frontend-e2e.log
          retention-days: 7

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e-smoke]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    # Two quick pushes to develop must not race each other over the same host.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGE_VPS_HOST }}
          username: ${{ secrets.STAGE_VPS_USER }}
          key: ${{ secrets.STAGE_VPS_SSH_KEY }}
          port: ${{ secrets.STAGE_VPS_PORT }}
          script: |
            set -e
            cd /opt/tada/app

            git pull origin develop

            docker compose build backend
            docker compose up -d --no-deps backend

            echo "Waiting for backend to be healthy..."
            sleep 10
            if ! docker compose exec -T backend npm run mig:run:prod; then
              echo "::error::Migration failed on staging. The backend container is now serving NEW code against the OLD schema — fix forward or revert the deploy; do not leave it in this state."
              exit 1
            fi

            echo "Staging deploy complete"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Serialize production deploys: concurrent pushes to main would race over
    # the same SSH host, git checkout and docker build.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      # ---------------------------------------------------------------------
      # Pre-deploy database backup — LAUNCH_PLAN item 1.
      #
      # Runs BEFORE git pull / build / migrate, and a non-zero exit fails the
      # whole job so that nothing is deployed. That is the point: the release
      # runs migrations against a populated production database, and
      # `migrationsTransactionMode: "each"` (data-source.ts) means a failure
      # halfway through leaves earlier migrations committed. The only floor
      # under that is a dump taken minutes earlier.
      #
      # We call the INSTALLED path ($HOME/.local/bin/tada-db-backup), not the
      # one in the repo checkout: at this point `git pull` has not run yet, so
      # the checkout is still at the previous release and may not contain the
      # script at all. Install it once with the "Install DB backup" workflow
      # (.github/workflows/backup-setup.yml).
      #
      # The path is under $HOME rather than /usr/local/bin because this host
      # gives the SSH user no passwordless sudo — see the header of
      # scripts/db-backup.sh.
      #
      # Staging deliberately does NOT do this: there is no backup.env on that
      # host and the bucket holds production data only.
      # ---------------------------------------------------------------------
      - name: Pre-deploy database backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            if [ ! -x "$HOME/.local/bin/tada-db-backup" ]; then
              echo "::error::$HOME/.local/bin/tada-db-backup is missing. Run the 'Install DB backup' workflow once before deploying."
              exit 1
            fi

            "$HOME/.local/bin/tada-db-backup" --pre-deploy

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /opt/tada/app

            git pull origin main

            docker compose build backend
            docker compose up -d --no-deps backend

            # TODO(LAUNCH_PLAN #4): migrate BEFORE serving new code.
            # As written, the new image starts serving against the OLD schema
            # for at least these 10 seconds. The correct shape is: run
            # migrations in a one-shot container on the new image, and only
            # `up -d --wait` on success.
            # LAUNCH_PLAN #5 (a health endpoint that actually touches the
            # database) is done — /api/health now runs SELECT 1 — so the only
            # remaining prerequisite for this reordering is LAUNCH_PLAN #2:
            # rehearse it against a restored copy of prod first. Do not reorder
            # before that rehearsal has happened.
            echo "Waiting for backend to be healthy..."
            sleep 10
            if ! docker compose exec -T backend npm run mig:run:prod; then
              echo "::error::Migration failed on production. The backend container is now serving NEW code against the OLD schema. Restore from the pre-deploy backup or fix forward IMMEDIATELY — see docs/ops/BACKUP_RUNBOOK.md."
              exit 1
            fi

            echo "Deploy complete"
