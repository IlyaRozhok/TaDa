services:
  backend:
    build:
      context: ./backend
    container_name: tada-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - /opt/tada/.env
    environment:
      - PORT=3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tada_network
    # Structured logging (step 3.3) writes a JSON line per request. The default
    # json-file driver never rotates, so cap it here.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  tada_network:
    driver: bridge
