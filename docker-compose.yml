services:
  backend:
    build:
      context: ./backend
    container_name: tada-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - /opt/tada/.env
    environment:
      - PORT=3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tada_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
networks:
  tada_network:
    driver: bridge
