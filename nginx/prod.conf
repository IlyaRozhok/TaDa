# Production nginx — reference copy of what actually runs on the prod VPS.
#
# ┌─ READ THIS BEFORE EDITING ──────────────────────────────────────────────────┐
# │ nginx on the hosts is NOT deployed from this repository.                    │
# │ The live file is /etc/nginx/sites-enabled/tada-prod, it was written by hand │
# │ on the host and its TLS lines are managed by Certbot, which rewrites them   │
# │ on renewal. `.github/workflows/deploy.yml` only touches docker compose — it │
# │ never copies anything into /etc/nginx.                                      │
# │                                                                             │
# │ So this file is a reference and a review surface, not a deployment source.  │
# │ Changing it changes nothing on the server: apply edits to the host by hand, │
# │ then mirror them back here. If the two ever disagree, THE HOST IS THE TRUTH.│
# └─────────────────────────────────────────────────────────────────────────────┘
#
# Transcribed from the host on 2026-08-06 (step 3.1 of the refactoring plan).
# What this replaced was a stale draft that never ran anywhere: it named
# `ta-da.co` instead of the `api.` subdomain, proxied `/api/` instead of `/`,
# and pointed at port 3002 — a port nothing on the host has ever listened on.
#
# Differences from stage that are deliberate, not drift:
#   - no WebSocket upgrade headers here (stage has them);
#   - SENTRY_DSN is set on prod only.

server {
    listen 80;
    server_name api.ta-da.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.ta-da.co;

    # Managed by Certbot — renewal rewrites these lines on the host.
    ssl_certificate     /etc/letsencrypt/live/api.ta-da.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ta-da.co/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Property and building media go through the API as multipart uploads.
    client_max_body_size 50M;

    # The whole vhost is the API: the frontend is on Vercel and never reaches
    # this server, so there is no separate `/api/` prefix to strip here. The
    # `api` global prefix lives inside Nest.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
