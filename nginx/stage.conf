# Staging nginx — reference copy of what actually runs on the stage VPS.
#
# ┌─ READ THIS BEFORE EDITING ──────────────────────────────────────────────────┐
# │ nginx on the hosts is NOT deployed from this repository.                    │
# │ The live file is /etc/nginx/sites-enabled/api.stage.ta-da.co, it was written│
# │ by hand on the host and its TLS lines are managed by Certbot, which rewrites│
# │ them on renewal. `.github/workflows/deploy.yml` only touches docker compose │
# │ — it never copies anything into /etc/nginx.                                 │
# │                                                                             │
# │ So this file is a reference and a review surface, not a deployment source.  │
# │ Changing it changes nothing on the server: apply edits to the host by hand, │
# │ then mirror them back here. If the two ever disagree, THE HOST IS THE TRUTH.│
# └─────────────────────────────────────────────────────────────────────────────┘
#
# Transcribed from the host on 2026-08-06 (step 3.1 of the refactoring plan).
# What this replaced was a stale draft: it named `stage.ta-da.co` instead of the
# `api.` subdomain and proxied `/api/` instead of `/`. The port it named (3001)
# was the one thing it had right.
#
# Differences from prod that are deliberate, not drift:
#   - the WebSocket upgrade headers below exist here and not on prod;
#   - SENTRY_DSN is not set on this host.

server {
    listen 80;
    server_name api.stage.ta-da.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.stage.ta-da.co;

    # Managed by Certbot — renewal rewrites these lines on the host.
    ssl_certificate     /etc/letsencrypt/live/api.stage.ta-da.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.stage.ta-da.co/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Property and building media go through the API as multipart uploads.
    client_max_body_size 50M;

    # The whole vhost is the API: the frontend is on Vercel and never reaches
    # this server, so there is no separate `/api/` prefix to strip here. The
    # `api` global prefix lives inside Nest.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade. Nothing in the app opens a socket today; the
        # headers are on the host, so they are here.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
